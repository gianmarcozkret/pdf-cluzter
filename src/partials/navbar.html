{{#if simpleMode}} {{> navbar-simple}} {{else}}
<nav class="bg-gray-900 border-b border-white/10 sticky top-0 z-30">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <div
        class="flex-shrink-0 flex items-center cursor-pointer"
        id="home-logo"
      >
        <img
          id="nav-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon-no-bg.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}Cluzter PDF{{/if}} Logo"
          class="h-8 w-8"
        />
        <span id="nav-brand" class="text-white font-bold text-xl ml-2">
          <a href="/"
            >{{#if brandName}}{{brandName}}{{else}}Cluzter PDF{{/if}}</a
          >
        </span>
      </div>

      <!-- Desktop Navigation (Cluzter PDF) -->
      <div
        class="hidden lg:flex flex-1 items-center justify-center space-x-2 xl:space-x-8"
      >
        <a href="/" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="/tools" class="nav-link" data-i18n="nav.allTools">All Tools</a>
        <a href="/about" class="nav-link" data-i18n="nav.about">About</a>
        <a href="/contact" class="nav-link" data-i18n="nav.contact">Contact</a>
      </div>

      <div class="hidden lg:flex items-center flex-shrink-0">
        <a
          href="https://cluzter.dev"
          target="_blank"
          rel="noopener"
          class="inline-flex items-center gap-1.5 text-sm font-semibold bg-indigo-600 text-white pl-3 pr-3.5 py-1.5 rounded-full transition-colors duration-200 hover:bg-indigo-500"
        >
          <i data-lucide="code" class="w-4 h-4"></i>
          <span data-i18n="nav.cluzterApi">Cluzter API</span>
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="lg:hidden flex items-center gap-4">
        <a
          href="https://cluzter.dev"
          target="_blank"
          rel="noopener"
          class="inline-flex items-center gap-1.5 text-sm font-semibold bg-indigo-600 text-white px-3 py-1 rounded-full hover:bg-indigo-500"
        >
          <span data-i18n="nav.cluzterApi">Cluzter API</span>
        </a>
        <button
          id="mobile-menu-button"
          type="button"
          class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500 transition-colors"
          aria-controls="mobile-menu"
          aria-expanded="false"
        >
          <span class="sr-only" data-i18n="nav.openMainMenu"
            >Open main menu</span
          >
          <!-- Hamburger Icon -->
          <svg
            id="menu-icon"
            class="block h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          <!-- Close Icon -->
          <svg
            id="close-icon"
            class="hidden h-6 w-6"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  <div
    id="mobile-menu"
    class="hidden lg:hidden bg-gray-900 border-t border-white/10"
  >
    <div class="px-2 pt-2 pb-3 space-y-1 text-center">
      <a href="/" class="mobile-nav-link" data-i18n="nav.home">Home</a>
      <a href="/tools" class="mobile-nav-link" data-i18n="nav.allTools"
        >All Tools</a
      >
      <a href="/about" class="mobile-nav-link" data-i18n="nav.about">About</a>
      <a href="/contact" class="mobile-nav-link" data-i18n="nav.contact"
        >Contact</a
      >
      <a
        href="https://cluzter.dev"
        target="_blank"
        rel="noopener"
        class="mobile-nav-link"
        data-i18n="nav.cluzterApi"
        >Cluzter API</a
      >
    </div>
  </div>
</nav>
{{/if}}
