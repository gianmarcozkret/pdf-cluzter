# Cabeceras de seguridad de pdf.cluzter.dev (se instala en /etc/nginx/snippets/).
# Todo se sirve desde el mismo dominio: la CSP no permite scripts, conexiones ni imágenes de otros sitios, así que
# ninguna librería podría enviar datos de los documentos fuera del navegador.
# COOP + COEP habilitan SharedArrayBuffer, que necesita LibreOffice (conversión de Office).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; frame-src 'self' blob:; frame-ancestors 'self'; form-action 'self'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Mientras el dueño revisa el sitio, que Google no lo indexe. Quitar esta línea al publicarlo.
add_header X-Robots-Tag "noindex, nofollow" always;
