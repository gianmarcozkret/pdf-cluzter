# pdf.cluzter.dev — Cluzter PDF (fork de BentoPDF). Sitio estático: todo el procesamiento ocurre en el navegador
# del visitante, el servidor solo entrega archivos. Entra por el túnel de Cloudflare (ingress → https://localhost:443).
# Reglas adaptadas del nginx.conf de BentoPDF (idiomas: solo es; en vive en la raíz).
# Se instala en /etc/nginx/sites-available/ con su enlace en sites-enabled/.

server {
    listen 80;
    server_name pdf.cluzter.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pdf.cluzter.dev;

    root /var/www/pdf.cluzter.dev;
    index index.html;
    absolute_redirect off;

    ssl_certificate /etc/ssl/cluzter/cluzter.dev.pem;
    ssl_certificate_key /etc/ssl/cluzter/cluzter.dev.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # El sitio no recibe archivos: nada de cuerpos grandes ni métodos que no sean de lectura.
    client_max_body_size 16k;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/javascript application/json application/wasm image/svg+xml;

    include /etc/nginx/snippets/pdf-cluzter-cabeceras.conf;
    error_page 404 /404.html;

    # --- Direcciones viejas o con .html → dirección limpia (como en BentoPDF) ---
    if ($request_uri ~ ^/en/?(\?.*)?$) { return 301 /$1; }
    if ($request_uri ~ ^/en/(.+)$) { return 301 /$1; }
    if ($request_uri ~ ^(/es)?/src/pages/([a-z0-9][a-z0-9-]*)\.html(\?.*)?$) { return 301 $1/$2$3; }
    if ($request_uri ~ ^/tools/$) { return 301 /tools; }
    if ($request_uri ~ ^/tools/([a-z0-9][a-z0-9-]+?)(?:\.html)?(\?.*)?$) { return 301 /$1$2; }
    if ($request_uri ~ ^(/es)?/index\.html(\?.*)?$) { return 301 $1/$2; }
    if ($request_uri ~ ^(/es)?/pdf-to-docx(?:\.html)?/?(\?.*)?$) { return 301 $1/pdf-to-word$2; }
    if ($request_uri ~ ^(/es)?/decrypt-pdf(?:\.html)?/?(\?.*)?$) { return 301 $1/unlock-pdf$2; }
    if ($request_uri ~ ^(/es)?/encrypt-pdf(?:\.html)?/?(\?.*)?$) { return 301 $1/protect-pdf$2; }
    if ($request_uri ~ ^(/es)?/change-text-color(?:\.html)?/?(\?.*)?$) { return 301 $1/text-color$2; }
    if ($request_uri ~ ^(/es)?/([a-z0-9][a-z0-9-]*)\.html(\?.*)?$) { return 301 $1/$2$3; }
    if ($request_uri ~ ^/es/([a-z0-9][a-z0-9-]*)/(\?.*)?$) { return 301 /es/$1$2; }
    if ($request_uri ~ ^/((?!(?:es|wasm|assets|images|locales|workers|pdfjs-viewer|pdfjs-annotation-viewer|libreoffice-wasm)/)[a-z0-9][a-z0-9-]*)/(\?.*)?$) { return 301 /$1$2; }

    location ~ /src/pages/ {
        return 404;
    }

    # Archivos ocultos o de compilación que no deben publicarse
    location ~ /\. {
        return 404;
    }

    location ~ ^/es(/.*)?$ {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ $uri.html =404;
        expires 5m;
    }

    location ~* \.html$ {
        expires 1h;
    }

    # LibreOffice: el cargador pide los .gz y el navegador los descomprime (Content-Encoding)
    location ~* /libreoffice-wasm/soffice\.wasm\.gz$ {
        gzip off;
        types {}
        default_type application/wasm;
        add_header Content-Encoding gzip;
        add_header Vary "Accept-Encoding";
        include /etc/nginx/snippets/pdf-cluzter-cabeceras.conf;
        expires 30d;
    }
    location ~* /libreoffice-wasm/soffice\.data\.gz$ {
        gzip off;
        types {}
        default_type application/octet-stream;
        add_header Content-Encoding gzip;
        add_header Vary "Accept-Encoding";
        include /etc/nginx/snippets/pdf-cluzter-cabeceras.conf;
        expires 30d;
    }

    # Motores WASM servidos desde el propio dominio (herramientas/preparar-wasm.sh)
    location ^~ /wasm/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        expires 7d;
    }

    location ~ ^/((sw\.js|coherentpdf\.browser\.min\.js|qpdf\.wasm)$|(workers|pdfjs-viewer|pdfjs-annotation-viewer)/) {
        expires epoch;
    }
    location ~* \.(wasm|data)$ {
        expires 30d;
    }
    location ^~ /assets/ {
        expires 1y;
    }
    location ~* \.(js|mjs|css|woff|woff2|ttf|eot|otf|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 7d;
    }
    location ~* \.json$ {
        expires epoch;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ $uri.html =404;
        expires 5m;
    }
}
